
name: CameraCraft Universal Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile CameraCraft
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 26
      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      # 3. Verify Java
      - name: Verify Java installation
        run: |
          java -version
          javac -version

      # 4. Install Gradle 9.9.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.0'

      # 5. Display build environment
      - name: Display environment
        run: |
          gradle --version
          echo "Starting CameraCraft compilation..."

      # 6. Compile the project
      - name: Build CameraCraft
        run: gradle clean build --no-daemon

      # 7. List generated JAR files
      - name: Verify build outputs
        run: |
          echo "Generated JAR files:"
          find build/libs -maxdepth 1 -type f -name "*.jar" -print

      # 8. Upload compiled mod
      - name: Upload CameraCraft JAR
        uses: actions/upload-artifact@v4
        with:
          name: CameraCraft-Fabric-26.3
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
