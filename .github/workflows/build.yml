
name: CameraCraft Universal Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.0'

      - name: Compile CameraCraft
        run: gradle clean build --no-daemon

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: CameraCraft-Fabric-26.3
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
